<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>To-do List</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Dosis&family=Josefin+Sans:wght@600&display=swap" rel="stylesheet">

</head>
<body>
    <div class="container">
        <h1>To-do List</h1>
        <div class="inputTask">
            <input type="text" id="inputField" placeholder="Enter Your Tasks">
            <button class="submitTaskBtn disabled">Submit</button>
        </div>
        <ol class="taskList">
            <div class="taskWrapper"></div>
            <button id="clearAllBtn" class="submitTaskBtn">Clear All</button>
        </ol>
    </div>
    <script src="script.js"></script>
</body>
</html>
